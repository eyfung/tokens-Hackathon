[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "clarity-trials"
version = "0.1.0"
description = "Self-Evolving Agent for Clinical Trial Design Simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pydantic>=2.0",
    "streamlit>=1.28",
    "plotly>=5.17",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]
