<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarity — Trial Design Agent</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🧪 Clarity</h1>
            <p class="subtitle">Self-Evolving Clinical Trial Design Agent</p>
        </header>

        <main>
            <section id="input-panel">
                <h2>Trial Design Parameters</h2>
                <form id="trial-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="disease">Disease Area</label>
                            <input type="text" id="disease" value="Hypertension">
                        </div>
                        <div class="form-group">
                            <label for="endpoint">Primary Endpoint</label>
                            <input type="text" id="endpoint" value="Systolic BP Reduction (mmHg)">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="effect">Expected Treatment Effect</label>
                            <input type="number" id="effect" value="10" min="0" step="0.5">
                        </div>
                        <div class="form-group">
                            <label for="variability">Standard Deviation</label>
                            <input type="number" id="variability" value="15" min="1" step="0.5">
                        </div>
                        <div class="form-group">
                            <label for="n-per-arm">Patients per Arm</label>
                            <input type="number" id="n-per-arm" value="100" min="10" step="10">
                        </div>
                    </div>
                    <button type="submit" id="run-btn">🚀 Run Simulation</button>
                </form>
            </section>

            <section id="results-panel">
                <h2>Results</h2>
                <div id="results-placeholder">
                    <p>Run a simulation to see results here.</p>
                </div>
            </section>
        </main>

        <footer>
            <p>tokens& Self-Evolving Agents Hackathon 2026</p>
        </footer>
    </div>

    <script src="static/js/app.js"></script>
</body>
</html>
